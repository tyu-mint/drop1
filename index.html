<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Drop · Encrypted Clash Config</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:Canvas;color:CanvasText}
main{width:min(560px,calc(100% - 40px));padding:28px 0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
h1{font-size:34px;letter-spacing:-.04em;margin:10px 0}
p{line-height:1.7;opacity:.8}
.panel{border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:18px;padding:18px;margin-top:24px}
code{display:block;word-break:break-all;font-size:13px;line-height:1.7;padding:12px;border-radius:10px;background:color-mix(in srgb,CanvasText 7%,Canvas)}
button,a{font:inherit}
button{margin-top:12px;border:0;border-radius:10px;padding:11px 15px;background:CanvasText;color:Canvas;cursor:pointer}
a{color:inherit}
footer{margin-top:28px;font-size:12px;opacity:.58}
</style>
</head>
<body>
<main>
<div class="eyebrow">DROP / AGE ENCRYPTED</div>
<h1>Encrypted Clash Config</h1>
<p>这里托管的是 age 加密后的 Clash / Mihomo 配置。请在支持 age 的客户端中填写订阅地址和你自己的 age 私钥。私钥不会存放在此网站或仓库中。</p>
<section class="panel">
<strong>订阅 URL</strong>
<code id="url">https://tyu-mint.github.io/drop1/drop.yaml</code>
<button id="copy" type="button">复制订阅地址</button>
<p><a href="./drop.yaml">打开加密配置文件 ↗</a></p>
</section>
<footer>仅提供加密文件分发；配置内容需由客户端使用匹配的 age 私钥解密。</footer>
</main>
<script>
document.getElementById('copy').addEventListener('click',async()=>{const b=document.getElementById('copy');try{await navigator.clipboard.writeText(document.getElementById('url').textContent);b.textContent='已复制';}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('url'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='请手动复制上方地址';}});
</script>
</body>
</html>
