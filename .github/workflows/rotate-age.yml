                  "encrypted_value": base64.b64encode(sealed).decode(),
                  "key_id": pub["key_id"]
              })

          try:
              set_current_key(new_key)
          except Exception:
              print("Could not update AGE_CURRENT_KEY; encrypted file still accepts the old key.")
              sys.exit(1)

          text = (
              "drop1 age 密钥已轮换。请把客户端中的 age 私钥更新为下面的新密钥：\n\n"
              + new_key
              + "\n\n原订阅地址不变：https://tyu-mint.github.io/drop1/drop.yaml"
              + "\n旧密钥会在下一次轮换时退出；请在 30 天内完成客户端更新。"
          )
          payload = json.dumps({"chat_id": chat, "text": text}).encode()
