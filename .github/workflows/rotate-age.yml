          python3 - <<'PY'
          import datetime, json
          from pathlib import Path
          Path("rotation-state.json").write_text(json.dumps({
              "last_rotated": datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          }, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
